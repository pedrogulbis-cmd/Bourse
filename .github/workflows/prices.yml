name: Prix et fondamentaux (3x par jour)

# Le snapshot pèse plusieurs dizaines de Mo. Le committer sur la branche
# principale trois fois par jour ferait grossir l'historique Git d'environ
# 100 Mo par jour, définitivement (Git ne supprime jamais un blob commité).
#
# On publie donc ces fichiers sur une branche ORPHELINE dédiée, réécrite
# intégralement à chaque exécution : le dépôt ne conserve qu'une seule
# version des données, et son poids reste constant dans le temps.
# Le site les lit via raw.githubusercontent.com (voir data.js).
on:
  schedule:
    # 8h, 12h et 20h heure française en été (UTC+2) — décalé d'une heure en hiver.
    - cron: "0 6,10,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: true   # inutile d'empiler deux récupérations de prix

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120     # l'univers complet représente des dizaines de milliers de titres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retirer d'éventuels snapshots restés sur la branche principale
        run: |
          # Transition depuis l'ancien fonctionnement : si des data-snapshot
          # traînent encore sur main, on les retire une bonne fois. Ils ne
          # servent plus (le site lit désormais la branche "data") et leur
          # présence entretiendrait la confusion.
          if ls data-snapshot*.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -q --cached data-snapshot*.json
            rm -f data-snapshot*.json
            git commit -q -m "Snapshots déplacés vers la branche data"
            git push
          else
            echo "Rien à nettoyer."
          fi

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Récupérer prix et fondamentaux
        run: python run.py

      - name: Publier sur la branche de données
        run: |
          # Garde-fou : si run.py n'a rien produit, autant s'arrêter ici avec un
          # message clair plutôt que d'écraser la branche data avec du vide.
          if ! ls data-snapshot*.json >/dev/null 2>&1; then
            echo "Aucun snapshot généré — la branche data n'est pas modifiée."
            exit 1
          fi
          mkdir -p /tmp/publish
          mv data-snapshot*.json /tmp/publish/

          cd /tmp/publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Snapshot — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git branch -M data
          # --force écrase entièrement la branche : c'est voulu, c'est ce qui
          # empêche l'historique de grossir.
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
