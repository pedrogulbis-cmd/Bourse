name: Historique du portefeuille (quotidien)

# Le workflow ne peut pas connaître tes positions : elles vivent dans le
# localStorage de ton navigateur. On lui passe donc la liste des symboles
# via un SECRET GitHub (HOLDINGS_SYMBOLS) — les secrets sont chiffrés au
# repos et automatiquement masqués dans les logs, même sur un dépôt public.
#
# Une seule exécution par jour : l'historique est constitué de cours de
# CLÔTURE quotidiens, le relancer trois fois par jour ne produirait
# strictement rien de plus.
on:
  schedule:
    # 20h30 heure française en été — après la clôture européenne, pour que la
    # bougie du jour soit définitive.
    - cron: "30 18 * * 1-5"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symboles séparés par des virgules (laisser vide pour utiliser le secret HOLDINGS_SYMBOLS)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: holdings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          pip install --upgrade --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git

      - name: Récupérer l'historique
        working-directory: scraper
        env:
          SYMBOLS_INPUT: ${{ inputs.symbols }}
          SYMBOLS_SECRET: ${{ secrets.HOLDINGS_SYMBOLS }}
          PASSPHRASE: ${{ secrets.HOLDINGS_PASSPHRASE }}
          SUFFIX: ${{ vars.HOLDINGS_SUFFIX }}
        run: |
          SYMS="${SYMBOLS_INPUT:-$SYMBOLS_SECRET}"
          if [ -z "$SYMS" ]; then
            echo "Aucun symbole fourni — définis le secret HOLDINGS_SYMBOLS."
            exit 1
          fi
          ARGS="--symbols $SYMS"
          [ -n "$SUFFIX" ] && ARGS="$ARGS --suffix $SUFFIX"
          [ -n "$PASSPHRASE" ] && ARGS="$ARGS --passphrase $PASSPHRASE"
          python fetch_holdings_history.py $ARGS

      - name: Committer
        run: |
          mv -f scraper/holdings-history*.json . 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add holdings-history*.json
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Historique du portefeuille — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
