name: Taux de change et indices (quotidien)

# Ces données bougent lentement : une seule mise à jour par jour suffit.
# Les fichiers produits sont petits (quelques centaines de Ko), on peut donc
# les committer directement sur la branche principale sans faire gonfler le
# dépôt — contrairement aux snapshots de prix, voir prices.yml.
on:
  schedule:
    # 6h00 heure française en été (UTC+2). En hiver l'exécution tombera à 7h00
    # locale : GitHub ne connaît que l'heure UTC, il n'y a pas de gestion
    # automatique du changement d'heure.
    - cron: "0 4 * * *"
  workflow_dispatch:        # permet aussi de lancer à la main depuis l'onglet Actions

permissions:
  contents: write           # nécessaire pour committer les fichiers produits

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          pip install --upgrade --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git

      - name: Taux de change
        working-directory: scraper
        run: python fetch_fx_rates.py

      - name: Historique des indices
        working-directory: scraper
        run: python fetch_index_history.py --bars 1500

      - name: Committer si quelque chose a changé
        run: |
          # Les scripts écrivent dans scraper/ ; le site attend les fichiers
          # à la racine du dépôt.
          mv -f scraper/fx-rates.json . 2>/dev/null || true
          mv -f scraper/index-history.json . 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fx-rates.json index-history.json
          # --quiet renvoie un code non nul s'il y a des changements : on ne
          # commite que dans ce cas, pour éviter un commit vide chaque jour.
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Taux de change et indices — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
