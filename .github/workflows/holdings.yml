name: Historique du portefeuille (quotidien)

# Le workflow ne peut pas connaître les positions : elles vivent dans le
# localStorage de chaque navigateur. On lui passe donc les symboles via des
# SECRETS GitHub — chiffrés au repos et masqués automatiquement dans les
# logs, même sur un dépôt public.
#
# Deux personnes utilisent ce site, chacune avec son propre fichier
# d'historique (holdings-history-NM.json et holdings-history-SM.json). Les
# deux sont traitées séquentiellement dans le MÊME job, avec un seul commit
# à la fin : deux jobs parallèles se marcheraient dessus au moment du push.
#
# Une seule exécution par jour : l'historique est constitué de cours de
# CLÔTURE quotidiens, le relancer plus souvent ne produirait rien de plus.
on:
  schedule:
    # 20h30 heure française en été — après la clôture européenne, pour que la
    # bougie du jour soit définitive. Décalé d'une heure en hiver (UTC).
    - cron: "30 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: holdings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          pip install --upgrade --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git

      - name: Historique — NM
        working-directory: scraper
        env:
          SYMS: ${{ secrets.HOLDINGS_SYMBOLS_NM }}
          PASS: ${{ secrets.HOLDINGS_PASSPHRASE }}
        run: |
          if [ -z "$SYMS" ]; then
            echo "Secret HOLDINGS_SYMBOLS_NM vide — étape ignorée."
            exit 0
          fi
          python fetch_holdings_history.py --symbols "$SYMS" --suffix NM --passphrase "$PASS"

      - name: Historique — SM
        working-directory: scraper
        env:
          SYMS: ${{ secrets.HOLDINGS_SYMBOLS_SM }}
          PASS: ${{ secrets.HOLDINGS_PASSPHRASE }}
        run: |
          if [ -z "$SYMS" ]; then
            echo "Secret HOLDINGS_SYMBOLS_SM vide — étape ignorée."
            exit 0
          fi
          python fetch_holdings_history.py --symbols "$SYMS" --suffix SM --passphrase "$PASS"

      - name: Committer
        run: |
          # Les scripts écrivent dans scraper/ ; le site attend les fichiers
          # à la racine du dépôt.
          mv -f scraper/holdings-history*.json . 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add holdings-history*.json
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Historique du portefeuille — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
