name: Momentum sur historique quotidien

# Recalcule le momentum 6 mois des titres présélectionnés pour Trending
# Value (fetch_momentum.py) à partir de l'historique quotidien Yahoo :
# fenêtre datée, cours ajustés, alertes de saut et de suspicion d'offre.
# Le fichier produit (quelques centaines de Ko) est committé sur la branche
# principale, comme fx-rates.json, et lu par le site à côté des pages.
on:
  schedule:
    # Après la récupération de 18h UTC (prices.yml) et la clôture américaine.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momentum
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Momentum 6 mois (historique quotidien)
        run: python fetch_momentum.py

      - name: Committer si quelque chose a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add momentum-history.json
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Momentum quotidien — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
